# =================================================================
# Mosquitto Configuration for Bangus Buhai
# =================================================================

# -----------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# -----------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd

# -----------------------------------------------------------------
# Listener 1: Port 1883 (Local/Internal - No TLS)
# -----------------------------------------------------------------
# Use this port for local development or for backend connections
# running on the same server/Docker network.
listener 1883 0.0.0.0

# -----------------------------------------------------------------
# Listener 2: Port 8883 (Public/External - TLS Required)
# -----------------------------------------------------------------
# Use this port for the ESP32 devices to connect over the internet.
# Requires valid certificates.
listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
