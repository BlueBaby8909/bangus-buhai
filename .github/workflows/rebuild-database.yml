name: Rebuild PostgreSQL checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bb_rebuild
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: bangus_buhai_rebuild_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bb_rebuild -d bangus_buhai_rebuild_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: rebuild
    env:
      BB_TEST_DATABASE_URL: postgresql+psycopg://bb_rebuild:ci-only-disposable@127.0.0.1:5432/bangus_buhai_rebuild_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - name: Install recorded dependencies
        run: python -m pip install -r backend/requirements.lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Fetch pinned disposable MQTT test broker
        run: docker pull eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
      - name: PostgreSQL migrations, relationships and event persistence
        run: python -m unittest backend.tests.test_database -v
      - name: Offline authentication, registry, readings, T13A HTTPS/custody checks
        run: python -m unittest discover -s backend/tests/unit -v
      - name: PostgreSQL and real certificate/password MQTT integration (generated credentials)
        run: python -m unittest discover -s backend/tests/integration -v
      - name: Contract compatibility
        run: |
          python -m unittest discover -s contracts/tests -v
          python -m contracts check
